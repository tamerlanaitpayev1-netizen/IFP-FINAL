name: ArenaQuiz CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ArenaQuiz.sln

      - name: Build solution (Release)
        run: dotnet build ArenaQuiz.sln --configuration Release --no-restore

      - name: Run xUnit & bUnit tests with code coverage
        run: dotnet test ArenaQuiz.sln --configuration Release --no-build --collect:"XPlat Code Coverage" --logger "console;verbosity=normal"
